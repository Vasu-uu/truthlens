<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TruthLens options</title>
    <link rel="stylesheet" href="panel.css" />
    <style>
      body { max-width: 560px; margin: 24px auto; }
      label { display:block; font-weight:600; margin:14px 0 4px; }
      input { width:100%; padding:9px 10px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--ink); font:inherit; }
      button { margin-top:14px; margin-right:8px; padding:9px 16px; border-radius:8px; border:1px solid var(--accent); background:transparent; color:var(--accent); font-weight:700; cursor:pointer; }
      button.primary { background:var(--accent); color:#04222a; }
      #status { margin-top:14px; min-height:1.5em; }
    </style>
  </head>
  <body>
    <header><span class="logo" aria-hidden="true"></span><h1>TruthLens options</h1></header>
    <label for="backend">Backend address</label>
    <input id="backend" type="url" placeholder="http://localhost:8000" />
    <p class="muted">Where your TruthLens backend runs. Images and text are sent only to this address.</p>
    <label for="app">Web app address (for “Open full report”)</label>
    <input id="app" type="url" placeholder="http://localhost:5173" />
    <div>
      <button class="primary" id="save">Save</button>
      <button id="test">Test connection</button>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
    <script type="module" src="options.js"></script>
  </body>
</html>
